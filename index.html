<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="utf-8">
<title>Mangalam Supplier Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#23282A; --graphite-2:#2C3234;
    --paper:#ECE6D9; --paper-dim:#DED5C0;
    --ink:#263029; --brass:#B8873A; --brass-dark:#8C6526;
    --moss:#5C7A5A; --rust:#A8432F; --line:#C9BEA3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--graphite);color:var(--paper);font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px;}

  /* Language switcher */
  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:24px;}
  .langbtn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;
    padding:7px 14px;border:1px solid #3A413F;border-radius:999px;background:transparent;
    color:#9AA29E;cursor:pointer;transition:.15s;
  }
  .langbtn.on{background:var(--brass);border-color:var(--brass);color:#231a0d;font-weight:600;}
  .langbtn:hover:not(.on){border-color:var(--brass);color:var(--brass);}

  .hero{position:relative;padding-bottom:32px;margin-bottom:8px;border-bottom:1px solid #3A413F;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:14px;}
  h1{font-family:'Zilla Slab','Noto Sans Devanagari',serif;font-weight:700;font-size:36px;line-height:1.15;margin:0 0 14px;color:var(--paper);}
  .sub{font-size:15px;line-height:1.65;color:#B9C0BC;max-width:58ch;margin:0;}

  .stamp{position:absolute;top:6px;right:0;width:88px;height:88px;border-radius:50%;border:2px dashed var(--brass);
    display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);
    font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:10px;letter-spacing:.08em;text-align:center;line-height:1.3;opacity:.9;}
  @media (max-width:640px){ .stamp{display:none;} }

  .card{background:var(--paper);color:var(--ink);border-radius:2px;padding:34px 30px;margin-top:28px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);}

  #loginScreen .lead{font-family:'Zilla Slab','Noto Sans Devanagari',serif;font-weight:600;font-size:19px;margin:0 0 18px;}
  #loginScreen input{
    width:100%;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.04em;
    padding:16px 14px;border:1px solid #C2B79C;background:#F8F5EE;border-radius:3px;color:var(--ink);
  }
  #loginScreen .hint{font-size:12.5px;color:#8A8171;margin-top:10px;}
  #loginScreen .err{font-size:13px;color:var(--rust);margin-top:10px;display:none;}
  .go-row{margin-top:22px;text-align:right;}
  button.go{
    font-family:'Zilla Slab','Noto Sans Devanagari',serif;font-weight:600;font-size:16px;background:var(--ink);color:var(--paper);
    border:none;padding:14px 30px;border-radius:2px;cursor:pointer;letter-spacing:.02em;
  }
  button.go:disabled{opacity:.5;cursor:default;}
  button.go:hover:not(:disabled){background:#1a2320;}

  .id-strip{display:flex;justify-content:space-between;align-items:center;background:#F2EBDA;border:1px solid var(--line);border-radius:3px;padding:12px 16px;margin-bottom:6px;}
  .id-strip .who{font-family:'Zilla Slab','Noto Sans Devanagari',serif;font-weight:600;font-size:15px;}
  .id-strip .role{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-dark);}
  .id-strip .switch{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8A8171;cursor:pointer;text-decoration:underline;}

  .entry{padding:20px 0;border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none;}
  .entry-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass-dark);letter-spacing:.06em;margin-bottom:8px;display:block;}
  .entry label.q{display:block;font-family:'Zilla Slab','Noto Sans Devanagari',serif;font-weight:600;font-size:16px;color:var(--ink);margin-bottom:12px;line-height:1.4;}
  textarea{resize:vertical;min-height:70px;width:100%;font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;font-size:14.5px;padding:11px 12px;border:1px solid #C2B79C;background:#F8F5EE;border-radius:3px;color:var(--ink);}

  .checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 12px;border:1px solid #C2B79C;border-radius:999px;cursor:pointer;user-select:none;background:#F8F5EE;color:var(--ink);transition:.15s;}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .scale{display:flex;gap:6px;margin-top:6px;}
  .scale button{flex:1;padding:12px 0;border:1px solid #C2B79C;background:#F8F5EE;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);cursor:pointer;transition:.15s;}
  .scale button.on{background:var(--brass);border-color:var(--brass-dark);color:#231a0d;font-weight:600;}
  .scale-labels{display:flex;justify-content:space-between;font-size:11px;color:#8A8171;margin-top:6px;font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace;}

  .section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--moss);margin:36px 0 4px;}
  .section-label .sub-note{color:#8A8171;text-transform:none;letter-spacing:0;font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;}
  .submit-row{margin-top:32px;text-align:right;}
  button.submit{font-family:'Zilla Slab','Noto Sans Devanagari',serif;font-weight:600;font-size:16px;background:var(--ink);color:var(--paper);border:none;padding:14px 30px;border-radius:2px;cursor:pointer;letter-spacing:.02em;}
  button.submit:disabled{opacity:.5;cursor:default;}
  button.submit:hover:not(:disabled){background:#1a2320;}

  .done{display:none;text-align:center;padding:50px 20px;}
  .done .stampbig{width:140px;height:140px;margin:0 auto 24px;border-radius:50%;border:3px dashed var(--moss);display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);color:var(--moss);font-family:'Zilla Slab',serif;font-weight:700;font-size:20px;text-align:center;line-height:1.3;}
  .done h2{font-family:'Zilla Slab','Noto Sans Devanagari',serif;color:var(--paper);}
  .done p{color:#B9C0BC;}

  #surveyCard{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar">
    <button class="langbtn on" data-lang="en">English</button>
    <button class="langbtn" data-lang="hi">हिंदी</button>
    <button class="langbtn" data-lang="mr">मराठी</button>
  </div>

  <div class="hero">
    <div class="stamp">SUPPLIER<br>LEDGER<br>· MLL ·</div>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>
  </div>

  <div class="card" id="loginScreen">
    <p class="lead" data-i18n="loginLead"></p>
    <input type="tel" id="phoneInput" maxlength="13" inputmode="numeric">
    <p class="hint" data-i18n="loginHint"></p>
    <p class="err" id="loginErr" data-i18n="loginErr"></p>
    <div class="go-row"><button class="go" id="loginBtn" data-i18n="continueBtn"></button></div>
  </div>

  <div class="card" id="surveyCard">
    <div class="id-strip">
      <div><div class="who" id="idName"></div><div class="role" id="idOwner"></div></div>
      <div class="switch" id="switchNum" data-i18n="switchNum"></div>
    </div>

    <form id="surveyForm">
      <div class="section-label" data-i18n="sectionProjects"></div>
      <div class="entry">
        <span class="entry-num">01</span>
        <label class="q" data-i18n="q1"></label>
        <div class="checks" id="projectChips"></div>
      </div>

      <div class="section-label"><span data-i18n="sectionChemistry"></span> <span class="sub-note" data-i18n="sectionChemistrySub"></span></div>

      <div class="entry"><span class="entry-num">02</span><label class="q" data-i18n="q2"></label>
        <div class="scale" data-q="q5"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">03</span><label class="q" data-i18n="q3"></label>
        <div class="scale" data-q="q6"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">04</span><label class="q" data-i18n="q4"></label>
        <div class="scale" data-q="q7"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">05</span><label class="q" data-i18n="q5"></label>
        <div class="scale" data-q="q8"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">06</span><label class="q" data-i18n="q6"></label>
        <div class="scale" data-q="q9"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">07</span><label class="q" data-i18n="q7"></label>
        <div class="scale" data-q="q10"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>

      <div class="section-label" data-i18n="sectionCapability"></div>
      <div class="entry"><span class="entry-num">08</span><label class="q" data-i18n="q8"></label>
        <div class="scale" data-q="q11"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">09</span><label class="q" data-i18n="q9"></label>
        <div class="scale" data-q="q12"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">10</span><label class="q" data-i18n="q10"></label>
        <div class="scale" data-q="q13"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>

      <div class="section-label" data-i18n="sectionFeedback"></div>
      <div class="entry"><span class="entry-num">11</span><label class="q" data-i18n="q11"></label><textarea id="q14"></textarea></div>
      <div class="entry"><span class="entry-num">12</span><label class="q" data-i18n="q12"></label><textarea id="q15"></textarea></div>
      <div class="entry"><span class="entry-num">13</span><label class="q" data-i18n="q13"></label><textarea id="q16"></textarea></div>

      <div class="submit-row"><button type="submit" class="submit" id="submitBtn" data-i18n="submitBtn"></button></div>
    </form>
  </div>

  <div class="done" id="doneScreen">
    <div class="stampbig" data-i18n="stampRecorded"></div>
    <h2 data-i18n="doneTitle"></h2>
    <p data-i18n="doneMsg"></p>
  </div>

</div>

      q13: 'आमच्या परचेस/सीबीडी नेतृत्वासाठी आणखी काही फीडबॅक?',
      scalePoor: 'कमी',
      scaleExcellent: 'उत्कृष्ट',
      submitBtn: 'नोंद सबमिट करा',
      recordingBtn: 'नोंद होत आहे…',
      stampRecorded: 'नोंद<br>झाली',
      doneTitle: 'धन्यवाद.',
      doneMsg: 'तुमचा फीडबॅक मंगलम परचेस व सीबीडीकडे नोंदवला गेला आहे.'
    }
  };

  let currentLang = 'en';

  function applyLang(lang){
    currentLang = lang;
    const t = I18N[lang];
    document.getElementById('htmlRoot').setAttribute('lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.innerHTML = t[key];
    });
    document.getElementById('phoneInput').placeholder = t.phonePlaceholder;
    document.querySelectorAll('.langbtn').forEach(b=>{
      b.classList.toggle('on', b.dataset.lang === lang);
    });
    // Re-apply owner label if a supplier is already identified
    if (supplier) {
      document.getElementById('idOwner').textContent = supplier.owner ? (t.ownerLabel + supplier.owner) : '';
    }
  }

  document.querySelectorAll('.langbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>applyLang(btn.dataset.lang));
  });

  // ============================================================
  // CONFIG
  // ============================================================
  const API_BASE = '/api/sheet';
  const PROJECTS = ['Midas III','Myra','Mithila-2','Momento','Starview',
    'Aikyam','Miraya','Marvel','Shyni Gold','Niyoshi Park'];

  const chipsContainer = document.getElementById('projectChips');
  const selectedProjects = new Set();
  PROJECTS.forEach(p=>{
    const chip = document.createElement('div');
    chip.className='chip'; chip.dataset.val=p; chip.textContent=p;
    chip.onclick=()=>{
      chip.classList.toggle('on');
      chip.classList.contains('on') ? selectedProjects.add(p) : selectedProjects.delete(p);
    };
    chipsContainer.appendChild(chip);
  });

  let supplier = null;

  document.getElementById('loginBtn').addEventListener('click', async function(){
    const val = document.getElementById('phoneInput').value.trim();
    if(!val) return;
    const btn = this;
    const t = I18N[currentLang];
    btn.disabled = true; btn.textContent = t.checkingBtn;
    document.getElementById('loginErr').style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}?action=lookup&phone=${encodeURIComponent(val)}`);
      const data = await res.json();
      btn.disabled = false; btn.textContent = t.continueBtn;

      if(data.found){
        supplier = data;
        document.getElementById('idName').textContent = data.name;
        document.getElementById('idOwner').textContent = data.owner ? (t.ownerLabel + data.owner) : '';
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('surveyCard').style.display = 'block';
      } else {
        document.getElementById('loginErr').style.display = 'block';
      }
    } catch(err) {
      btn.disabled = false; btn.textContent = t.continueBtn;
      alert('Something went wrong checking that number. Please try again.\n'+err);
    }
  });

  document.getElementById('switchNum').addEventListener('click', function(){
    supplier = null;
    document.getElementById('phoneInput').value = '';
    document.getElementById('surveyCard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
  });

  const scaleQs = ['q5','q6','q7','q8','q9','q10','q11','q12','q13'];
  const answers = {};
  scaleQs.forEach(q=>{
    const container = document.querySelector(`.scale[data-q="${q}"]`);
    for(let i=1;i<=5;i++){
      const b = document.createElement('button');
      b.type='button'; b.textContent=i;
      b.onclick=()=>{
        answers[q]=i;
        container.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
      };
      container.appendChild(b);
    }
  });

  document.getElementById('surveyForm').addEventListener('submit', async function(e){
    e.preventDefault();
    if(!supplier){ alert('Please verify your mobile number first.'); return; }
    const btn = document.getElementById('submitBtn');
    const t = I18N[currentLang];
    btn.disabled = true; btn.textContent = t.recordingBtn;

    const payload = {
      action: 'submit',
      supplierName: supplier.name,
      phone: supplier.phone,
      owner: supplier.owner,
      projects: Array.from(selectedProjects),
      q5:answers.q5||'', q6:answers.q6||'', q7:answers.q7||'', q8:answers.q8||'',
      q9:answers.q9||'', q10:answers.q10||'', q11:answers.q11||'', q12:answers.q12||'',
      q13:answers.q13||'',
      q14:document.getElementById('q14').value,
      q15:document.getElementById('q15').value,
      q16:document.getElementById('q16').value
    };

    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(data.ok){
        document.getElementById('surveyCard').style.display='none';
        document.getElementById('doneScreen').style.display='block';
      } else {
        throw new Error(data.error || 'unknown error');
      }
    } catch(err) {
      alert('Something went wrong recording your entry. Please try again.\n'+err);
      btn.disabled=false; btn.textContent=t.submitBtn;
    }
  });

  applyLang('en');
</script>
</body>
</html>
