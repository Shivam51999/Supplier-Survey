<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="utf-8">
<title>Mangalam Supplier Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#2B2B2B; --graphite-2:#3A3A3A;
    --paper:#FFFFFF; --paper-dim:#F0F0F0;
    --ink:#333333; --brass:#EA1D24; --brass-dark:#B0151B;
    --moss:#4C8C5A; --rust:#A8432F; --line:#E0E0E0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--graphite);color:var(--paper);font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px;}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

  /* Language switcher */
  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:24px;}
  .langbtn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;
    padding:7px 14px;border:1px solid #3A413F;border-radius:999px;background:transparent;
    color:#9AA29E;cursor:pointer;transition:.15s;
  }
  .langbtn.on{background:var(--brass);border-color:var(--brass);color:#FFFFFF;font-weight:600;}
  .langbtn:hover:not(.on){border-color:var(--brass);color:var(--brass);}

  /* Who are you */
  .rolebar{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap;}
  .rolebtn{
    flex:1 1 260px;font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-weight:500;font-size:14px;line-height:1.3;
    padding:13px 16px;border:1px solid #4A4A4A;border-radius:3px;background:transparent;color:#C9CFCB;cursor:pointer;text-align:left;transition:.15s;
  }
  .rolebtn.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600;box-shadow:inset 4px 0 0 var(--brass);}
  .rolebtn:hover:not(.on){border-color:var(--brass);color:#fff;}

  .hero{position:relative;padding-bottom:32px;margin-bottom:8px;border-bottom:1px solid #3A413F;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:14px;}
  h1{font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-weight:700;font-size:36px;line-height:1.15;margin:0 0 14px;color:var(--paper);}
  .sub{font-size:15px;line-height:1.65;color:#B9C0BC;max-width:58ch;margin:0;}

  .stamp{position:absolute;top:6px;right:0;width:88px;height:88px;border-radius:50%;border:2px dashed var(--brass);
    display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);
    font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:10px;letter-spacing:.08em;text-align:center;line-height:1.3;opacity:.9;}
  @media (max-width:640px){ .stamp{display:none;} h1{font-size:30px;} }

  .card{background:var(--paper);color:var(--ink);border-radius:2px;padding:34px 30px;margin-top:28px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);}
  @media (max-width:480px){ .card{padding:26px 18px;} }

  #loginScreen .lead, #teamLogin .lead{font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-weight:600;font-size:19px;margin:0 0 18px;}
  #loginScreen input, #teamLogin input{
    width:100%;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.04em;
    padding:16px 14px;border:1px solid #D9D9D9;background:#F7F7F7;border-radius:3px;color:var(--ink);
  }
  .hint{font-size:12.5px;color:#8A8171;margin-top:10px;}
  .err{font-size:13px;color:var(--rust);margin-top:10px;display:none;}
  .go-row{margin-top:22px;text-align:right;}
  button.go{
    font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-weight:600;font-size:16px;background:var(--ink);color:var(--paper);
    border:none;padding:14px 30px;border-radius:2px;cursor:pointer;letter-spacing:.02em;
  }
  button.go:disabled{opacity:.5;cursor:default;}
  button.go:hover:not(:disabled){background:#1a2320;}

  .id-strip{display:flex;justify-content:space-between;align-items:center;background:#F0F0F0;border:1px solid var(--line);border-radius:3px;padding:12px 16px;margin-bottom:6px;}
  .id-strip .who{font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-weight:600;font-size:15px;}
  .id-strip .role{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-dark);}
  .id-strip .switch{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8A8171;cursor:pointer;text-decoration:underline;}

  .entry{padding:20px 0;border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none;}
  .entry-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass-dark);letter-spacing:.06em;margin-bottom:8px;display:block;}
  .entry label.q{display:block;font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-weight:600;font-size:16px;color:var(--ink);margin-bottom:12px;line-height:1.4;}
  textarea, .field{resize:vertical;width:100%;font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;font-size:14.5px;padding:11px 12px;border:1px solid #D9D9D9;background:#F7F7F7;border-radius:3px;color:var(--ink);}
  textarea{min-height:70px;}
  .field{font-size:15px;padding:13px 12px;}

  .checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .chip{font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace;font-size:12px;padding:7px 12px;border:1px solid #D9D9D9;border-radius:999px;cursor:pointer;user-select:none;background:#F7F7F7;color:var(--ink);transition:.15s;}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .rolebtn small{display:block;font-weight:400;opacity:.75;font-size:12px;margin-top:3px;}
  .chip.team{font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:3px;}
  .chip.team.on{background:var(--brass);border-color:var(--brass-dark);color:#fff;}

  .scale{display:flex;gap:6px;margin-top:6px;}
  .scale button{flex:1;padding:12px 0;border:1px solid #D9D9D9;background:#F7F7F7;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);cursor:pointer;transition:.15s;}
  .scale button.on{background:var(--brass);border-color:var(--brass-dark);color:#FFFFFF;font-weight:600;}
  .scale-labels{display:flex;justify-content:space-between;font-size:11px;color:#8A8171;margin-top:6px;font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace;}

  .section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-dark);margin:36px 0 4px;}
  .section-label:first-of-type{margin-top:22px;}
  .section-label .sub-note{color:#8A8171;text-transform:none;letter-spacing:0;font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;}
  .submit-row{margin-top:32px;text-align:right;}
  button.submit{font-family:'Poppins','Noto Sans Devanagari',sans-serif;font-weight:600;font-size:16px;background:var(--ink);color:var(--paper);border:none;padding:14px 30px;border-radius:2px;cursor:pointer;letter-spacing:.02em;}
  button.submit:disabled{opacity:.5;cursor:default;}
  button.submit:hover:not(:disabled){background:#1a2320;}

  .done{display:none;text-align:center;padding:50px 20px;}
  .done .stampbig{width:140px;height:140px;margin:0 auto 24px;border-radius:50%;border:3px dashed var(--brass);display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);color:var(--brass);font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;text-align:center;line-height:1.3;}
  .done h2{font-family:'Poppins','Noto Sans Devanagari',sans-serif;color:var(--paper);}
  .done p{color:#B9C0BC;}
  .done button.go{margin-top:18px;background:var(--brass);}
  .done button.go:hover:not(:disabled){background:var(--brass-dark);}

  #surveyCard, #teamCard, #teamLogin{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar">
    <button class="langbtn on" data-lang="en">English</button>
    <button class="langbtn" data-lang="hi">हिंदी</button>
    <button class="langbtn" data-lang="mr">मराठी</button>
  </div>

  <div class="rolebar" role="group" aria-label="Who are you">
    <button type="button" class="rolebtn on" data-role="supplier" data-i18n="roleSupplier"></button>
    <button type="button" class="rolebtn" data-role="team" data-i18n="roleTeam"></button>
  </div>

  <div class="hero">
    <div class="stamp" id="stampTxt">SUPPLIER<br>LEDGER<br>· MLL ·</div>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 id="heroTitle" data-i18n="title"></h1>
    <p class="sub" id="heroSub" data-i18n="subtitle"></p>
  </div>

  <!-- ===================== SUPPLIER / CONTRACTOR FLOW (rates Mangalam) ===================== -->
  <div class="card" id="loginScreen">
    <p class="lead" data-i18n="loginLead"></p>
    <input type="tel" id="phoneInput" maxlength="13" inputmode="numeric" aria-label="Mobile number">
    <p class="hint" data-i18n="loginHint"></p>
    <p class="err" id="loginErr" data-i18n="loginErr"></p>
    <div class="go-row"><button class="go" id="loginBtn" data-i18n="continueBtn"></button></div>
  </div>

  <div class="card" id="surveyCard">
    <div class="id-strip">
      <div><div class="who" id="idName"></div><div class="role" id="idOwner"></div></div>
      <div class="switch" id="switchNum" data-i18n="switchNum"></div>
    </div>

    <form id="surveyForm">
      <div class="section-label" data-i18n="sectionProjects"></div>
      <div class="entry">
        <span class="entry-num">01</span>
        <label class="q" data-i18n="q1"></label>
        <div class="checks" id="projectChips"></div>
      </div>

      <div class="section-label"><span data-i18n="sectionChemistry"></span> <span class="sub-note" data-i18n="sectionChemistrySub"></span></div>

      <div class="entry"><span class="entry-num">02</span><label class="q" data-i18n="q2"></label>
        <div class="scale" data-q="q5"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">03</span><label class="q" data-i18n="q3"></label>
        <div class="scale" data-q="q6"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">04</span><label class="q" data-i18n="q4"></label>
        <div class="scale" data-q="q7"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">05</span><label class="q" data-i18n="q5"></label>
        <div class="scale" data-q="q8"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">06</span><label class="q" data-i18n="q6"></label>
        <div class="scale" data-q="q9"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">07</span><label class="q" data-i18n="q7"></label>
        <div class="scale" data-q="q10"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>

      <div class="section-label" data-i18n="sectionCapability"></div>
      <div class="entry"><span class="entry-num">08</span><label class="q" data-i18n="q8"></label>
        <div class="scale" data-q="q11"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">09</span><label class="q" data-i18n="q9"></label>
        <div class="scale" data-q="q12"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>
      <div class="entry"><span class="entry-num">10</span><label class="q" data-i18n="q10"></label>
        <div class="scale" data-q="q13"></div><div class="scale-labels"><span data-i18n="scalePoor"></span><span data-i18n="scaleExcellent"></span></div></div>

      <div class="section-label" data-i18n="sectionFeedback"></div>
      <div class="entry"><span class="entry-num">11</span><label class="q" for="q14" data-i18n="q11"></label><textarea id="q14"></textarea></div>
      <div class="entry"><span class="entry-num">12</span><label class="q" for="q15" data-i18n="q12"></label><textarea id="q15"></textarea></div>
      <div class="entry"><span class="entry-num">13</span><label class="q" for="q16" data-i18n="q13"></label><textarea id="q16"></textarea></div>

      <div class="submit-row"><button type="submit" class="submit" id="submitBtn" data-i18n="submitBtn"></button></div>
    </form>
  </div>

  <div class="done" id="doneScreen">
    <div class="stampbig" data-i18n="stampRecorded"></div>
    <h2 data-i18n="doneTitle"></h2>
    <p data-i18n="doneMsg"></p>
  </div>

  <!-- ===================== MANGALAM TEAM FLOW (rates a contractor) ===================== -->
  <div class="card" id="teamLogin">
    <p class="lead" data-i18n="teamCodeLead"></p>
    <input type="password" id="teamCodeInput" autocomplete="off" aria-label="Team code">
    <p class="hint" data-i18n="teamCodeHint"></p>
    <p class="err" id="teamCodeErr"></p>
    <div class="go-row"><button class="go" id="teamLoginBtn" data-i18n="continueBtn"></button></div>
  </div>

  <div class="card" id="teamCard">
    <form id="teamForm">
      <div class="section-label" data-i18n="teamSecWho"></div>
      <div class="entry">
        <span class="entry-num">01</span>
        <label class="q" for="teamName" data-i18n="yourName"></label>
        <input class="field" type="text" id="teamName" maxlength="60" autocomplete="name">
      </div>
      <div class="entry">
        <span class="entry-num">02</span>
        <label class="q" data-i18n="yourTeam"></label>
        <div class="checks" id="teamChips" role="group"></div>
      </div>

      <div class="section-label" data-i18n="teamSecWhom"></div>
      <div class="entry">
        <span class="entry-num">03</span>
        <label class="q" for="teamContractor" data-i18n="contractorLabel"></label>
        <input class="field" type="text" id="teamContractor" list="contractorList" maxlength="80" autocomplete="off">
        <datalist id="contractorList"></datalist>
        <p class="hint" data-i18n="contractorHint"></p>
      </div>
      <div class="entry">
        <span class="entry-num">04</span>
        <label class="q" data-i18n="teamProjects"></label>
        <div class="checks" id="teamProjectChips"></div>
      </div>

      <div class="section-label"><span id="teamQsTitle"></span> <span class="sub-note" data-i18n="sectionChemistrySub"></span></div>
      <div id="teamQs"></div>

      <div class="section-label" data-i18n="sectionFeedback"></div>
      <div class="entry">
        <span class="entry-num" id="teamCommentNum">10</span>
        <label class="q" for="teamComment" data-i18n="commentLabel"></label>
        <textarea id="teamComment" maxlength="350"></textarea>
        <p class="hint" data-i18n="commentHint"></p>
      </div>

      <div class="submit-row"><button type="submit" class="submit" id="teamSubmitBtn" data-i18n="teamSubmit"></button></div>
    </form>
  </div>

  <div class="done" id="teamDone">
    <div class="stampbig" data-i18n="stampRecorded"></div>
    <h2 data-i18n="doneTitle"></h2>
    <p data-i18n="teamDoneMsg"></p>
    <button type="button" class="go" id="rateAnother" data-i18n="rateAnother"></button>
  </div>

</div>

  // LANGUAGE
  // ============================================================
  function applyLang(lang){
    currentLang = lang;
    const t = I18N[lang];
    $('htmlRoot').setAttribute('lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.innerHTML = t[key];
    });
    $('phoneInput').placeholder = t.phonePlaceholder;
    document.querySelectorAll('.langbtn').forEach(b=>{
      b.classList.toggle('on', b.dataset.lang === lang);
    });
    if (supplier) {
      $('idOwner').textContent = supplier.owner ? (t.ownerLabel + supplier.owner) : '';
    }
    renderTeam();
  }

  document.querySelectorAll('.langbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>applyLang(btn.dataset.lang));
  });

  function showScreens(){

    $('surveyCard').style.display  = sup && supplier && !doneSup ? 'block' : 'none';
    $('doneScreen').style.display  = sup && doneSup ? 'block' : 'none';
    $('teamLogin').style.display   = !sup && !TS.code && !doneTeam ? 'block' : 'none';
    $('teamCard').style.display    = !sup && TS.code && !doneTeam ? 'block' : 'none';
    $('teamDone').style.display    = !sup && doneTeam ? 'block' : 'none';
  }

    $('heroTitle').setAttribute('data-i18n', r === 'supplier' ? 'title' : 'titleTeam');
    $('heroSub').setAttribute('data-i18n', r === 'supplier' ? 'subtitle' : 'subtitleTeam');
    $('stampTxt').innerHTML = r === 'supplier' ? 'SUPPLIER<br>LEDGER<br>· MLL ·' : 'CONTRACTOR<br>RATING<br>· MLL ·';
    applyLang(currentLang);
    showScreens();
  }
  document.querySelectorAll('.rolebtn').forEach(b=>b.addEventListener('click', ()=>setRole(b.dataset.role)));

  // ============================================================
  // SUPPLIER / CONTRACTOR FLOW (rates Mangalam)
  // ============================================================
  const chipsContainer = $('projectChips');
  const selectedProjects = new Set();
  PROJECTS.forEach(p=>{
    const chip = document.createElement('div');
    chip.className='chip'; chip.dataset.val=p; chip.textContent=p;
    chip.onclick=()=>{
      chip.classList.toggle('on');
      chip.classList.contains('on') ? selectedProjects.add(p) : selectedProjects.delete(p);
    };
    chipsContainer.appendChild(chip);
  });

  $('loginBtn').addEventListener('click', async function(){
    const val = $('phoneInput').value.trim();
    if(!val) return;
    const btn = this;
    const t = I18N[currentLang];
    btn.disabled = true; btn.textContent = t.checkingBtn;
    $('loginErr').style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}?action=lookup&phone=${encodeURIComponent(val)}`);
      const data = await res.json();
      btn.disabled = false; btn.textContent = t.continueBtn;

      if(data.found){
        supplier = data;
        $('idName').textContent = data.name;
        $('idOwner').textContent = data.owner ? (t.ownerLabel + data.owner) : '';
        showScreens();
      } else {
        $('loginErr').style.display = 'block';
      }
    } catch(err) {
      btn.disabled = false; btn.textContent = t.continueBtn;
      alert('Something went wrong checking that number. Please try again.\n'+err);
    }
  });

  $('switchNum').addEventListener('click', function(){
    supplier = null;
    $('phoneInput').value = '';
    showScreens();
  });

  const scaleQs = ['q5','q6','q7','q8','q9','q10','q11','q12','q13'];
  const answers = {};
  scaleQs.forEach(q=>{
    const container = document.querySelector(`.scale[data-q="${q}"]`);
    for(let i=1;i<=5;i++){
      const b = document.createElement('button');
      b.type='button'; b.textContent=i;
      b.onclick=()=>{
        answers[q]=i;
        container.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
      };
      container.appendChild(b);
    }
  });

  $('surveyForm').addEventListener('submit', async function(e){
    e.preventDefault();
    if(!supplier){ alert('Please verify your mobile number first.'); return; }
    const btn = $('submitBtn');
    const t = I18N[currentLang];
    btn.disabled = true; btn.textContent = t.recordingBtn;

    const payload = {
      action: 'submit',
      supplierName: supplier.name,
      phone: supplier.phone,
      owner: supplier.owner,
      projects: Array.from(selectedProjects),
      q5:answers.q5||'', q6:answers.q6||'', q7:answers.q7||'', q8:answers.q8||'',
      q9:answers.q9||'', q10:answers.q10||'', q11:answers.q11||'', q12:answers.q12||'',
      q13:answers.q13||'',
      q14:$('q14').value,
      q15:$('q15').value,
      q16:$('q16').value
    };

    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(data.ok){
        doneSup = true;
        showScreens();
      } else {
        throw new Error(data.error || 'unknown error');
      }
    } catch(err) {
      alert('Something went wrong recording your entry. Please try again.\n'+err);
      btn.disabled=false; btn.textContent=t.submitBtn;
    }
  });

  // ============================================================
  // MANGALAM TEAM FLOW (rates a contractor)
  // ============================================================
  function rateCall(action, p, code){
    return new Promise((resolve, reject)=>{
      if(!RATE_API_URL){ reject(new Error('NOT_READY')); return; }
      const cb = 'mlr' + Date.now() + Math.floor(Math.random()*1e6);
      const s = document.createElement('script');
      const q = new URLSearchParams({action, callback: cb, code});
      if(p) q.set('p', JSON.stringify(p));
      const done = ()=>{ clearTimeout(timer); delete window[cb]; s.remove(); };
      const timer = setTimeout(()=>{ done(); reject(new Error('NET')); }, 30000);
      window[cb] = d => { done(); d && d.ok ? resolve(d) : reject(new Error(d && d.error || 'NET')); };
      s.onerror = ()=>{ done(); reject(new Error('NET')); };
      s.src = RATE_API_URL + '?' + q;
      document.head.appendChild(s);
    });
  }

  function teamOf(){ return TEAMS.find(x=>x.id === TS.team); }
  function qKeys(){ return ['0','1','2','3','a']; }

  function renderTeam(){
    const t = I18N[currentLang];
    // team chips
    const tc = $('teamChips');
    tc.innerHTML = '';
    TEAMS.forEach(tm=>{
      const c = document.createElement('div');
      c.className = 'chip team' + (TS.team === tm.id ? ' on' : '');
      c.setAttribute('role','button'); c.setAttribute('tabindex','0');
      c.textContent = t['team_' + tm.key];
      const pick = ()=>{
        if(TS.team !== tm.id){ Object.keys(teamAnswers).forEach(k=>delete teamAnswers[k]); }
        TS.team = tm.id;
        try{ localStorage.setItem('mlr_team', tm.id); }catch(e){}
        renderTeam();
      };
      c.onclick = pick;
      c.onkeydown = e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); } };
      tc.appendChild(c);
    });
    // project chips
    const pc = $('teamProjectChips');
    pc.innerHTML = '';
    (TS.projects.length ? TS.projects : PROJECTS).forEach(p=>{
      const c = document.createElement('div');
      c.className = 'chip' + (teamProjects.has(p) ? ' on' : '');
      c.textContent = p;
      c.onclick = ()=>{ teamProjects.has(p) ? teamProjects.delete(p) : teamProjects.add(p); c.classList.toggle('on'); };
      pc.appendChild(c);
    });
    // contractor suggestions
    $('contractorList').innerHTML = TS.names.map(n=>`<option value="${esc(n)}">`).join('');
    // questions for the chosen team
    const tm = teamOf(), box = $('teamQs');
    if(!tm){
      $('teamQsTitle').textContent = '';
      box.innerHTML = `<div class="entry"><p class="hint" style="margin:0">${esc(t.pickTeamFirst)}</p></div>`;
      return;
    }
    $('teamQsTitle').textContent = t.teamQsTitle.replace('{team}', t['team_' + tm.key]);
    const qs = t.tq[tm.key].concat([t.tq.a]);
    box.innerHTML = '';
    qs.forEach((text, i)=>{
      const key = i < 4 ? String(i) : 'a';
      const row = document.createElement('div');
      row.className = 'entry';
      const num = String(i + 5).padStart(2, '0');
      row.innerHTML = `<span class="entry-num">${num}</span><label class="q">${esc(text)}</label><div class="scale"></div><div class="scale-labels"><span>${esc(t.scalePoor)}</span><span>${esc(t.scaleExcellent)}</span></div>`;
      const sc = row.querySelector('.scale');
      for(let n=1;n<=5;n++){
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = n;
        if(teamAnswers[key] === n) b.classList.add('on');
        b.onclick = ()=>{
          teamAnswers[key] = n;
          sc.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
          b.classList.add('on');
        };
        sc.appendChild(b);
      }
      box.appendChild(row);
    });
    $('teamCommentNum').textContent = String(qs.length + 5).padStart(2, '0');
  }

  async function enterTeam(code){
    const t = I18N[currentLang];
    const btn = $('teamLoginBtn'), err = $('teamCodeErr');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = t.checkingBtn;
    try{
      const d = await rateCall('listContractors', null, code);
      TS.code = code;
      TS.names = d.names || [];
      TS.projects = d.projects || [];
      try{ sessionStorage.setItem('mlr_code', code); }catch(e){}
      try{
        $('teamName').value = localStorage.getItem('mlr_name') || '';
        const sv = localStorage.getItem('mlr_team');
        if(TEAMS.some(x=>x.id === sv)) TS.team = sv;
      }catch(e){}
      renderTeam();
      showScreens();
    }catch(e){
      const m = String(e.message);
      err.textContent = m === 'NOT_READY' ? t.teamNotReady : /access code/i.test(m) ? t.teamCodeErr : t.teamNetErr;
      err.style.display = 'block';
      try{ sessionStorage.removeItem('mlr_code'); }catch(x){}
    }
    btn.disabled = false; btn.textContent = t.continueBtn;
  }

  $('teamLoginBtn').addEventListener('click', ()=>{
    const code = $('teamCodeInput').value.trim();
    if(code) enterTeam(code);
  });
  $('teamCodeInput').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('teamLoginBtn').click(); } });

  $('teamForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const t = I18N[currentLang], tm = teamOf();
    const name = $('teamName').value.trim(), vendor = $('teamContractor').value.trim();
    if(!name || !vendor || !tm || qKeys().some(k=>!teamAnswers[k])){ alert(t.teamMissing); return; }
    const area = ['0','1','2','3'].reduce((s,k)=>s + teamAnswers[k], 0) / 4;
    const scores = {};
    scores[tm.area] = Math.round(area * 100) / 100;
    scores[APPROACH_AREA] = teamAnswers.a;
    const d = new Date(Date.now() + 5.5*3600*1000);   // today in India
    const payload = {
      vendor, by: name, dept: tm.id,
      site: Array.from(teamProjects).join(', '),
      scores, comment: $('teamComment').value.trim().slice(0, 350),
      date: d.toISOString().slice(0, 10)
    };
    const btn = $('teamSubmitBtn');
    btn.disabled = true; btn.textContent = t.recordingBtn;
    try{
      await rateCall('submitRating', payload, TS.code);
      try{ localStorage.setItem('mlr_name', name); }catch(x){}
      doneTeam = true;
      showScreens();
    }catch(err){
      const m = String(err.message);
      alert(/access code/i.test(m) ? t.teamCodeErr : (m === 'NET' || m === 'NOT_READY') ? t.teamNetErr : m);
    }
    btn.disabled = false; btn.textContent = t.teamSubmit;
  });

  $('rateAnother').addEventListener('click', ()=>{
    Object.keys(teamAnswers).forEach(k=>delete teamAnswers[k]);
    teamProjects.clear();
    $('teamContractor').value = '';
    $('teamComment').value = '';
    doneTeam = false;
    renderTeam();
    showScreens();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

  // Returning team member in the same browser tab: skip the code screen
  (function resume(){
    let c = '';
    try{ c = sessionStorage.getItem('mlr_code') || ''; }catch(e){}
    TS.resumeCode = c;
  })();

  applyLang('en');
  showScreens();
  if (TS.resumeCode) { /* resumed lazily when the person opens the team tab */
    document.querySelector('.rolebtn[data-role="team"]').addEventListener('click', function once(){
      this.removeEventListener('click', once);
      if (!TS.code) enterTeam(TS.resumeCode);
    });
  }
</script>
</body>
</html>
